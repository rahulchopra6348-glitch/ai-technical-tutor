<!DOCTYPE html>
<html>
<head>
  <title>AI Technical Tutor</title>
</head>
<body style="font-family: Arial; text-align:center; padding:40px; background:#111; color:white;">

<h1>AI Technical Tutor</h1>

<div id="chatBox" style="border:1px solid gray; height:300px; overflow:auto; margin-bottom:20px; padding:10px;"></div>

<input id="message" placeholder="Ask something..." style="width:300px; padding:10px;">
<button onclick="sendMessage()" style="padding:10px;">Send</button>

<script>
async function sendMessage() {
  const input = document.getElementById("message");
  const chatBox = document.getElementById("chatBox");
  const userMessage = input.value;

  if (!userMessage) return;

  chatBox.innerHTML += "<p><b>You:</b> " + userMessage + "</p>";
  input.value = "";

  try {
    const response = await fetch("https://rahulchopra.app.n8n.cloud/webhook/62603814-bbcb-47b7-98ac-9875cf5927e1", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": "581263"
      },
      body: JSON.stringify({ message: userMessage })
    });

    const data = await response.json();

    chatBox.innerHTML += "<p><b>AI:</b> " + (data.output || data.reply || JSON.stringify(data)) + "</p>";
  } catch (error) {
    chatBox.innerHTML += "<p style='color:red;'><b>Error:</b> Could not connect to AI</p>";
    console.error(error);
  }
}
</script>

</body>
</html>
